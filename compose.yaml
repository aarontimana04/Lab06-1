services:

  postgres:
    image: postgres:16.3

    env_file:
      - .env.dev

    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password

    secrets:
      - pg_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - private

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5


  flask:
    build: .

    env_file:
      - .env.dev

    secrets:
      - pg_password

    ports:
      - "8080:5000"

    networks:
      - public
      - private

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:


networks:

  public:

  private:
    internal: true


secrets:
  pg_password:
    file: ./pg_password.txt
